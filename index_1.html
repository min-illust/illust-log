<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Min. ILLUST LOG</title>
<meta name="description" content="Min.のイラストを日付順に並べたタイムライン">
<meta property="og:title" content="Min. ILLUST LOG">
<meta property="og:description" content="Min.のイラストタイムライン">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=Courier+Prime:wght@400;700&display=swap">
<style>
body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* Layout: a photocopied gig-flyer wall — one ink rule down the left, each illustration pasted on as a taped flyer, dated like a show stub. */
:root{
  --paper:#eeece6; --ink:#141312; --ink-soft:#55524c; --line:#c9c5bb;
  --hot:#ff2e6e; --tape:#f4e04d; --card:#fbfaf6; --on-hot:#fff;
  --f-display:"Dela Gothic One","Hiragino Kaku Gothic StdN","Noto Sans JP",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"Courier Prime","Courier New",ui-monospace,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121110; --ink:#efece4; --ink-soft:#a39f96; --line:#34312d;
  --hot:#ff4f86; --tape:#d9c53c; --card:#1c1a18; --on-hot:#fff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121110; --ink:#efece4; --ink-soft:#a39f96; --line:#34312d;
  --hot:#ff4f86; --tape:#d9c53c; --card:#1c1a18; --on-hot:#fff; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.7;
  background-image:radial-gradient(color-mix(in srgb,var(--ink) 9%,transparent) 1px,transparent 1.2px);background-size:5px 5px}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:28px 80px}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;border-bottom:4px solid var(--ink);padding-bottom:14px}
.mast h1{font-family:var(--f-display);font-weight:400;font-size:clamp(40px,10vw,84px);line-height:.9;margin:0;letter-spacing:-.01em}
.mast h1 .dot{color:var(--hot)}
.mast h1 small{display:block;font-size:.34em;letter-spacing:.32em;margin-top:.5em;font-family:var(--f-mono);font-weight:700}
.meta{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;text-align:right;color:var(--ink-soft)}
.meta b{color:var(--ink);font-size:22px;font-family:var(--f-display);font-weight:400;letter-spacing:0;display:block}

.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-block:18px 8px}
.chip{font:700 12px/1 var(--f-mono);letter-spacing:.08em;border:2px solid var(--ink);background:transparent;color:var(--ink);padding:7px 10px;cursor:pointer;text-transform:uppercase}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.chip:focus-visible,.btn:focus-visible,.post button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--hot);outline-offset:2px}
.spacer{flex:1}
.btn{font:400 15px/1 var(--f-display);border:3px solid var(--ink);background:var(--hot);color:var(--on-hot);padding:11px 16px;cursor:pointer;box-shadow:4px 4px 0 var(--ink)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--ink)}
.btn.ghost{background:var(--card);color:var(--ink)}

/* timeline */
.tl{position:relative;margin-top:28px;padding-left:34px}
.tl::before{content:"";position:absolute;left:9px;top:0;bottom:0;border-left:3px dashed var(--ink)}
.month{position:relative;margin:34px 0 14px -34px;display:flex;align-items:center;gap:12px}
.month span{font-family:var(--f-display);font-size:26px;background:var(--ink);color:var(--paper);padding:2px 12px 4px;transform:rotate(-2deg)}
.month em{font:700 12px var(--f-mono);font-style:normal;letter-spacing:.12em;color:var(--ink-soft)}

.post{position:relative;margin-bottom:44px}
.post::before{content:"";position:absolute;left:-31px;top:18px;width:14px;height:14px;background:var(--hot);border:3px solid var(--ink);border-radius:50%}
.stub{display:inline-flex;gap:10px;align-items:baseline;font:700 13px var(--f-mono);letter-spacing:.1em;margin-bottom:20px}
.stub .d{font-family:var(--f-display);font-weight:400;font-size:20px;letter-spacing:0}
.stub .no{color:var(--ink-soft)}
.flyer{position:relative;background:var(--card);border:2px solid var(--ink);padding:12px 12px 16px;box-shadow:6px 6px 0 color-mix(in srgb,var(--ink) 85%,transparent);max-width:620px}
.post:nth-of-type(odd) .flyer{transform:rotate(-.6deg)}
.post:nth-of-type(even) .flyer{transform:rotate(.7deg)}
.flyer::before,.flyer::after{content:"";position:absolute;top:-12px;width:78px;height:22px;background:color-mix(in srgb,var(--tape) 82%,transparent);mix-blend-mode:multiply}
.flyer::before{left:14px;transform:rotate(-7deg)}
.flyer::after{right:14px;transform:rotate(6deg)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .flyer::before,:root:not([data-theme="light"]) .flyer::after{mix-blend-mode:normal;opacity:.75}}
:root[data-theme="dark"] .flyer::before,:root[data-theme="dark"] .flyer::after{mix-blend-mode:normal;opacity:.75}
.shot{display:block;width:100%;padding:0;border:0;background:var(--line);cursor:zoom-in;overflow:hidden}
.shot img{display:block;width:100%;height:auto;max-height:78vh;object-fit:contain;background:var(--paper)}
.flyer h2{font-family:var(--f-display);font-weight:400;font-size:clamp(20px,4.6vw,28px);line-height:1.25;margin:14px 0 4px;text-wrap:balance}
.flyer p{margin:6px 0 0;white-space:pre-wrap;max-width:62ch;overflow-wrap:anywhere}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.tag{font:700 11px var(--f-mono);letter-spacing:.08em;background:var(--hot);color:var(--on-hot);padding:3px 7px}
.ops{display:flex;gap:8px;margin-top:12px;border-top:1px dashed var(--line);padding-top:10px}
.ops button{font:700 12px var(--f-mono);letter-spacing:.06em;background:none;border:0;color:var(--ink-soft);cursor:pointer;padding:4px 0;text-decoration:underline}
.ops button.del{color:var(--hot)}

.empty{border:3px dashed var(--ink);padding:36px 22px;text-align:center;margin-top:28px;background:var(--card)}
.empty strong{display:block;font-family:var(--f-display);font-weight:400;font-size:clamp(28px,7vw,46px);line-height:1.05;transform:rotate(-2deg)}
.empty p{color:var(--ink-soft);margin:14px auto 0;max-width:40ch}

.foot{margin-top:40px;font:700 11px var(--f-mono);letter-spacing:.14em;color:var(--ink-soft);text-transform:uppercase;border-top:2px solid var(--ink);padding-top:10px}

/* lightbox */
.lb{position:fixed;inset:0;background:rgba(10,9,8,.92);display:flex;align-items:center;justify-content:center;padding:24px 16px;z-index:50;cursor:zoom-out}
.lb img{max-width:100%;max-height:100%;object-fit:contain;box-shadow:0 0 0 3px #fff}

/* composer */
dialog{border:3px solid var(--ink);background:var(--card);color:var(--ink);padding:0;width:min(560px,calc(100vw - 32px));box-shadow:8px 8px 0 var(--ink)}
dialog::backdrop{background:rgba(10,9,8,.6)}
.cmp{display:grid;gap:14px;padding:20px}
.cmp h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0}
.cmp label{display:grid;gap:4px;font:700 12px var(--f-mono);letter-spacing:.08em;text-transform:uppercase}
.cmp input,.cmp textarea{font:15px var(--f-body);color:var(--ink);background:var(--paper);border:2px solid var(--ink);padding:9px 10px;width:100%;min-width:0;text-transform:none;letter-spacing:0}
.cmp textarea{min-height:96px;resize:vertical}
.drop{border:2px dashed var(--ink);padding:16px;text-align:center;cursor:pointer;background:var(--paper);font:13px var(--f-body);text-transform:none;letter-spacing:0}
.drop img{max-height:200px;margin:0 auto 8px;display:block}
.row{display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap}
.err{color:var(--hot);font-weight:700;font-size:13px;min-height:1em;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--paper);font:700 13px var(--f-mono);padding:10px 16px;z-index:60;max-width:calc(100vw - 32px)}
@media (prefers-reduced-motion: reduce){.post .flyer{transform:none!important}.btn:active{transform:none}}
@media (max-width:480px){.tl{padding-left:26px}.tl::before{left:5px}.post::before{left:-27px}.month{margin-left:-26px}.meta{text-align:left}}

</style>
</head>
<body>
<div class="wrap">
  <header class="mast">
    <h1>Min<span class="dot">.</span><small>ILLUST LOG</small></h1>
    <div class="meta"><b id="count">0</b>WORKS POSTED<br><span id="range">—</span></div>
  </header>
  <div class="bar"><div id="filters" style="display:contents"></div></div>
  <main id="tl" class="tl" aria-live="polite"></main>
  <div id="empty" class="empty" hidden>
    <strong>NO WORKS<br>ON THE WALL YET</strong>
    <p>まだイラストが貼られていません。新しい作品はここに日付順で並びます。</p>
  </div>
  <footer class="foot">© Min. — all illustrations by the artist</footer>
</div>
<div class="lb" id="lb" hidden><img id="lbImg" alt=""></div>

<script>
(() => {
  const $ = (s) => document.getElementById(s);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  let posts = [], filter = null;

  // 管理画面の日付は "2026-10-04" 形式。念のため時刻付きでも先頭10文字を使う
  const day = (p) => String(p.date || "").slice(0, 10);
  const sorted = (list) => [...list].sort((a, b) => day(b).localeCompare(day(a)));
  const tagsOf = (p) => (Array.isArray(p.tags) ? p.tags : String(p.tags || "").split(/[\s,、]+/))
    .map(t => String(t).trim().replace(/^#/, "")).filter(Boolean);

  function render(){
    const list = filter ? posts.filter(p => tagsOf(p).includes(filter)) : posts;
    const all = list.length;
    let out = "", last = "";
    sorted(list).forEach((p, i) => {
      const [y, m, d] = day(p).split("-");
      if (!y || !m || !d) return;
      const mk = y + "." + m;
      if (mk !== last){
        last = mk;
        const n = list.filter(q => day(q).startsWith(y + "-" + m)).length;
        out += `<div class="month"><span>${mk}</span><em>${n} WORK${n > 1 ? "S" : ""}</em></div>`;
      }
      const wd = ["SUN","MON","TUE","WED","THU","FRI","SAT"][new Date(+y, m - 1, +d).getDay()];
      const tags = tagsOf(p).map(t => `<span class="tag">#${esc(t)}</span>`).join("");
      out += `<article class="post">
        <div class="stub"><span class="d">${m}/${d}</span><span>${wd}</span><span class="no">NO.${String(all - i).padStart(3, "0")}</span></div>
        <div class="flyer">
          ${p.image ? `<button class="shot" data-zoom aria-label="${esc(p.title)}を拡大"><img src="${esc(String(p.image).replace(/^\//, ""))}" alt="${esc(p.title)}" loading="lazy"></button>` : ""}
          <h2>${esc(p.title)}</h2>
          ${p.comment ? `<p>${esc(p.comment)}</p>` : ""}
          ${tags ? `<div class="tags">${tags}</div>` : ""}
        </div></article>`;
    });
    $("tl").innerHTML = out;
    $("empty").hidden = posts.length > 0;
    $("count").textContent = posts.length;
    const s = sorted(posts);
    $("range").textContent = s.length ? `${day(s[s.length-1]).replaceAll("-", ".")} → ${day(s[0]).replaceAll("-", ".")}` : "—";
    const tags = [...new Set(posts.flatMap(tagsOf))];
    $("filters").innerHTML = tags.length ? [`<button class="chip" data-tag="" aria-pressed="${!filter}">ALL</button>`,
      ...tags.map(t => `<button class="chip" data-tag="${esc(t)}" aria-pressed="${filter === t}">#${esc(t)}</button>`)].join("") : "";
  }

  fetch("data/posts.json", {cache: "no-store"})
    .then(r => r.ok ? r.json() : {posts: []})
    .then(j => { posts = Array.isArray(j.posts) ? j.posts : []; })
    .catch(() => {})
    .finally(render);

  document.addEventListener("click", (e) => {
    const t = e.target.closest("[data-tag],[data-zoom]");
    if (t && t.dataset.tag !== undefined){ filter = t.dataset.tag || null; render(); }
    else if (t){ $("lbImg").src = t.querySelector("img").src; $("lb").hidden = false; }
    else if (e.target.closest("#lb")){ $("lb").hidden = true; }
  });
  document.addEventListener("keydown", e => { if (e.key === "Escape") $("lb").hidden = true; });
})();
</script>
</body>
</html>
