# Min. ILLUST LOG 管理画面の設定
backend:
  name: github
  repo: min-illust/min-illust.github.io
  branch: main
  base_url: https://api.netlify.com
  site_domain: min-illust.netlify.app

locale: ja
site_url: https://min-illust.github.io/
display_url: https://min-illust.github.io/

# 管理画面から上げた画像の保存場所（サイトには自動で軽くした版が出ます）
media_folder: images
public_folder: /images

collections:
  # ── 作品（1件ずつ保存） ──
  - name: posts
    label: 作品
    label_singular: 作品
    folder: content/posts
    format: json
    extension: json
    create: true
    delete: true
    slug: "{{year}}{{month}}{{day}}-{{hour}}{{minute}}{{second}}"
    identifier_field: title
    summary: "{{date}}｜{{category}}｜{{title}}"
    sortable_fields: [date, title, category]
    view_groups:
      - { label: 分類, field: category }
    view_filters:
      - { label: ピックアップだけ, field: pickup, pattern: true }
    editor: { preview: false }
    fields:
      - { name: title, label: タイトル, widget: string }
      - { name: date, label: 日付, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - name: category
        label: 分類
        widget: relation
        collection: settings
        file: categories
        search_fields: ["categories.*.name"]
        display_fields: ["categories.*.name"]
        value_field: "categories.*.name"
      - name: images
        label: 画像（複数OK・任意）
        label_singular: 画像
        widget: list
        required: false
        field: { name: src, label: 画像, widget: image, choose_url: false }
      - name: media
        label: 曲・動画のURL（Suno / YouTube・任意）
        label_singular: URL
        widget: list
        required: false
        hint: "Sunoの曲ページ、YouTubeの動画ページ（限定公開もOK）のURLを貼ってください"
        field: { name: url, label: URL, widget: string }
      - { name: comment, label: コメント（任意）, widget: text, required: false }
      - { name: tags, label: タグ（キャラ名・作品名など・カンマ区切り・任意）, widget: list, required: false }
      - { name: charapu, label: キャラぷのURL（あるときだけ）, widget: string, required: false, hint: "入れると「このキャラと話す」ボタンが出ます" }
      - { name: pickup, label: ピックアップ（将来のポートフォリオ用・今はサイトに表示されません）, widget: boolean, default: false, required: false }

  # ── サイト設定 ──
  - name: settings
    label: サイト設定
    editor: { preview: false }
    files:
      - name: categories
        label: 分類一覧
        file: content/categories.json
        format: json
        fields:
          - name: categories
            label: 分類（上から順にトップに並びます）
            label_singular: 分類
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: 分類名, widget: string }
              - { name: description, label: 説明（任意）, widget: string, required: false }
      - name: site
        label: サイト情報
        file: content/site.json
        format: json
        fields:
          - { name: description, label: サイトの説明（Xカードなどに出ます）, widget: string, required: false }
          - { name: goatcounter, label: GoatCounterのCode（アクセス解析）, widget: string, required: false, hint: "例：min-illust（https://min-illust.goatcounter.com の min-illust の部分）" }
          - { name: x_handle, label: XのID（@なし・任意）, widget: string, required: false, hint: "Xで共有したときに「@ID より」が付きます" }
